# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: ng-flex-layout - publish package to GitHub registry

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com
          scope: '@alessiobianchini'
      - run: npm i
      - run: npm run build
      - run: cd dist/releases/flex-layout
      # - run: npm config set @alessiobianchini:registry=https://npm.pkg.github.com
      # - run: npm config set @alessiobianchini:always-auth=true
      - run: npm config set //npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN
      - run: npm config set scope "@alessiobianchini"
      - run: npm publish --@alessiobianchini:registry=https://npm.pkg.github.com/ --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
